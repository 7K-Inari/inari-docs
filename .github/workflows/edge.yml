name: edge

# Per-merge edge releases: every push to main cuts a GitHub prerelease
# v<pending>-edge.<shortsha>. inari-docs has no versioned artifact (the site
# deploys continuously to Pages) — the prerelease is a marker tag only, so
# the edge scheme stays uniform across all inari repos. Skipped on release
# merges.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: edge-main
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Skip on release merges
        id: gate
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          parent2=""
          if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            parent2="$(git log -1 --pretty=%s HEAD^2)"
          fi
          if echo "$msg" | grep -qiE '^chore(\(.*\))?: release' \
             || echo "$parent2" | grep -qiE '^chore(\(.*\))?: release'; then
            echo "release merge detected ($msg) — skipping edge"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  prerelease:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create edge prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          edge="$(scripts/resolve-edge-version.sh .)"
          gh release create "v${edge}" \
            --prerelease \
            --title "edge ${edge}" \
            --notes "Edge marker for docs as of ${GITHUB_SHA}. The site deploys continuously; this tag only keeps the edge scheme uniform across repos."
