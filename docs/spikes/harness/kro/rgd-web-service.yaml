apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: web-service
spec:
  schema:
    apiVersion: v1alpha1
    kind: WebService
    spec:
      name: string
      image: string
      replicas: integer | default=2
      port: integer | default=8080
    status:
      availableReplicas: integer
  resources:
    - id: deploy
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.name}
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app: ${schema.spec.name}
          template:
            metadata:
              labels:
                app: ${schema.spec.name}
            spec:
              containers:
                - name: app
                  image: ${schema.spec.image}
                  ports:
                    - containerPort: ${schema.spec.port}
    - id: svc
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}
        spec:
          selector:
            app: ${schema.spec.name}
          ports:
            - port: 80
              targetPort: ${schema.spec.port}
